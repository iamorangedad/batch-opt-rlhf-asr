framework: openrlhf
algorithm: ppo
extends: ../base.yaml

model:
  name_or_path: openai/whisper-tiny
  language: en
  task: transcribe
  use_lora: true

data:
  train_path: benchmark/data/librispeech_tiny/train_rl.jsonl
  eval_path: benchmark/data/librispeech_tiny/eval_rl.jsonl

openrlhf:
  rollout_batch_size: 1
  num_episodes: 1
  ppo_epochs: 1
  clip_eps: 0.2
  kl_coef: 0.05
  temperature: 0.7
  num_generations: 2
  use_ray: false

training:
  output_dir: outputs/benchmark/jetson_openrlhf
  learning_rate: 3.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 5
  logging_steps: 1
  bf16: false
  fp16: true
  gradient_checkpointing: true
