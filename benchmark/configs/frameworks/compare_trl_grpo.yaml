framework: trl
algorithm: grpo
extends: ../base.yaml

model:
  name_or_path: openai/whisper-tiny
  language: en
  task: transcribe
  use_lora: true

data:
  train_path: benchmark/data/librispeech_tiny/train_rl.jsonl
  eval_path: benchmark/data/librispeech_tiny/eval_rl.jsonl
  preference_train_path: benchmark/data/librispeech_tiny/train_pref.jsonl
  preference_eval_path: benchmark/data/librispeech_tiny/eval_pref.jsonl

grpo:
  num_generations: 2
  temperature: 0.7
  beta: 0.04
  max_completion_length: 128

training:
  output_dir: outputs/benchmark/compare_trl_grpo
  learning_rate: 3.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 8
  logging_steps: 1
  bf16: false
  fp16: false
