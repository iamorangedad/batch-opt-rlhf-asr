# HuggingFace TRL — GRPO (online RL with WER/CER reward)
framework: trl
algorithm: grpo
extends: ../base.yaml

grpo:
  num_generations: 4          # group size G
  temperature: 0.7
  beta: 0.04                  # KL penalty vs reference
  max_completion_length: 128
  loss_type: grpo

training:
  output_dir: outputs/benchmark/trl_grpo
  learning_rate: 3.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_steps: 50
