# verl (Volcano Engine RL / HybridFlow) — single-controller style adapter
framework: verl
algorithm: grpo
extends: ../base.yaml

verl:
  # Full verl stack targets decoder-only LLMs + vLLM/SGLang.
  # This benchmark ships a HybridFlow-inspired single-controller trainer
  # that colocates rollout and update for Whisper ASR.
  rollout_n: 4
  temperature: 0.7
  kl_coef: 0.04
  clip_ratio: 0.2
  micro_batch_size: 1
  use_fsdp: false

training:
  output_dir: outputs/benchmark/verl
  learning_rate: 3.0e-6
  max_steps: 30
