framework: verl
algorithm: grpo
extends: ../base.yaml

model:
  name_or_path: openai/whisper-tiny
  language: en
  task: transcribe
  use_lora: true

data:
  train_path: benchmark/data/librispeech_tiny/train_rl.jsonl
  eval_path: benchmark/data/librispeech_tiny/eval_rl.jsonl

verl:
  rollout_n: 2
  temperature: 0.7
  kl_coef: 0.04
  clip_ratio: 0.2
  micro_batch_size: 1
  use_fsdp: false

training:
  output_dir: outputs/benchmark/jetson_verl
  learning_rate: 3.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 5
  logging_steps: 1
  bf16: false
  fp16: true
  gradient_checkpointing: true
