# Local-path PVC for HF cache + outputs on a single-node k3s Jetson.
# On multi-node clusters, switch to an RWX volume or node-local hostPath.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jetson-asr-data
  namespace: asr-jetson
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
  # Uncomment if your k3s uses the local-path provisioner explicitly:
  # storageClassName: local-path
---
# Optional hostPath PV for boards without a dynamic provisioner.
# Apply only if the PVC above stays Pending.
